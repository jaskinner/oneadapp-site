[build]
  publish = "."

# Stable URLs revalidate. Immutable caching is only for versioned filenames.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/theme/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/instrument-sans-v1.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
