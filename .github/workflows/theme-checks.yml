name: theme checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-inlined-tokens.mjs
      - run: node scripts/check-contrast.mjs
      - run: node scripts/check-copy.mjs
