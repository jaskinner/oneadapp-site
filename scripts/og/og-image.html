<!doctype html>
<!-- Source for /og-image.png (1200x630). Regenerate with: node scripts/render-og-image.mjs -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: "Instrument Sans";
        font-weight: 400 700;
        src: url("../../fonts/instrument-sans-v1.woff2") format("woff2");
    }
    :root {
        --background: #F2EEE2;
        --foreground: #1A1917;
        --muted-foreground: #57534A;
        --signal: #EBA010;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        background: var(--background);
        color: var(--foreground);
        font-family: "Instrument Sans", Arial, sans-serif;
        padding: 64px 80px;
        display: flex;
        flex-direction: column;
        border-top: 16px solid var(--foreground);
    }
    .wordmark { display: inline-flex; align-items: flex-end; font-size: 72px; line-height: 1; letter-spacing: -0.01em; }
    .one { font-weight: 500; }
    .ad { font-weight: 700; display: inline-flex; flex-direction: column; }
    .ad::after { content: ""; display: block; height: 9px; margin-top: 6px; background: var(--signal); }
    h1 { margin-top: auto; font-size: 84px; font-weight: 700; line-height: 1.02; letter-spacing: -0.02em; max-width: 960px; }
    .rule { margin-top: 40px; border-top: 2px solid var(--foreground); padding-top: 22px;
            display: flex; justify-content: space-between; font-size: 28px; color: var(--muted-foreground); }
    .rule strong { color: var(--foreground); font-weight: 600; }
</style>
</head>
<body>
    <div class="wordmark"><span class="one">one</span><span class="ad">AD</span></div>
    <h1>Book your crew.<br>Rehire the best.</h1>
    <div class="rule"><span>Crew booking software for film productions</span><strong>oneadapp.com</strong></div>
</body>
</html>
